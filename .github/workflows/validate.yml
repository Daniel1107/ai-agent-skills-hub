name: validate

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-manifest.mjs
      - run: node scripts/generate-readmes.mjs
      - run: git diff --exit-code

